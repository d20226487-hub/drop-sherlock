# --- Shared log rotation (added 2026-05-27) ---------------------------------
# The Docker daemon's default json-file driver has NO rotation when
# `Config: {}`, so each container's log file grows forever — measured
# 50 MB – 1 GB/day in production for chatty API containers, eating the
# deployment server's disk over weeks. Anchoring `&default-logging` here
# keeps the cap uniform across api/web/caddy without copy-paste drift.
# Cap math: max-size 10m × max-file 5 = 50 MB ceiling per container,
# ever. Old files auto-truncated; nothing for an operator to manage.
# Override per-service by re-specifying `logging:` (e.g. bump caddy if
# its access log volume becomes the limiting signal).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # Cap glibc's malloc arena count (added 2026-06-16). This is a single
    # in-process uvicorn worker that runs multi-hour, tens-of-thousands-of-
    # domain jobs in-process. glibc creates one malloc arena per thread (up
    # to 8×CPU = 128 on this 16-core host) and does NOT return their freed
    # pages to the OS, so RSS sticks at the job's high-water mark (observed
    # 3-5 GB on a 60,977-domain availability run). Pinning ARENA_MAX=2
    # bounds that per-thread fragmentation; the periodic malloc_trim(0) in
    # main.py actively returns freed heap on top. Diagnosed via smaps:
    # 3.85 GB private-dirty anon spread across ~35 64-128 MB glibc arenas.
    environment:
      MALLOC_ARENA_MAX: "2"
    # Blast-radius cap so a runaway / stalled job can't consume host RAM
    # (added 2026-06-16). Generous headroom over a healthy run's working
    # set. If a legitimate large job gets OOM-killed at this ceiling, raise
    # it rather than lowering — the container auto-restarts (restart:
    # unless-stopped) and the runner auto-pauses any in-flight run, which is
    # resumable from the UI, so the worst case is a pause, not data loss.
    mem_limit: 4g
    volumes:
      - ./data:/data
      # Dev iteration speed (2026-06-18): bind-mount the app source so a
      # backend change applies with `docker compose restart api` (~5s)
      # instead of a full image rebuild. The image still bakes its own
      # copy (COPY app ./app) for prod/CI — this mount just shadows it on
      # this box. PYTHONDONTWRITEBYTECODE=1 (Dockerfile) keeps the host
      # tree free of .pyc clutter. Remove this line for a real prod deploy.
      - ./backend/app:/app/app
    expose:
      - "8000"
    logging: *default-logging
    # Healthcheck so Caddy / docker compose know when the API is
    # actually ready. Hits /health (returns {"ok":true}) so we don't
    # depend on any business endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 120s start_period (2026-05-27): the boot-time catch-up backup
      # added on the same day can take 20-40 seconds on a ~200 MB DB
      # (gzipping a SQLite online-backup is CPU-bound) before the
      # health endpoint becomes reachable. The previous 20s window was
      # too tight: api timed out "unhealthy" once, which caused
      # docker-compose to skip the `web` container (`depends_on: api:
      # service_healthy`) even though api recovered seconds later. 2
      # minutes covers a 1 GB DB with comfortable headroom.
      start_period: 120s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    env_file: .env
    # Force Next standalone to bind 0.0.0.0 so the healthcheck (which
    # hits localhost) can reach it. Default standalone behaviour binds
    # to the container's network IP only — localhost:3000 inside the
    # container would `Connection refused`.
    environment:
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Next.js doesn't ship a built-in health route; the root page is
      # cheap and returns 200 once the server is ready. node-native to
      # avoid depending on wget/curl being in the slim base image.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      # 8081 / 8444 chosen because serp-monitor's caddy already owns 8080 / 8443.
      # Explicit `0.0.0.0:` prefix added 2026-05-29: without it, Docker
      # advertises the port on both IPv4 and IPv6 (`[::]:8081`), but
      # Docker Desktop's host-side IPv6 forwarding to the Linux VM is
      # often broken — Windows browsers resolve `localhost` to `::1`
      # first, connection is refused, browser shows ERR_EMPTY_RESPONSE.
      # Explicit IPv4 bind avoids the broken `[::]` advertisement
      # entirely; localhost will resolve via 127.0.0.1 (which works).
      - "0.0.0.0:${HTTP_PORT:-8081}:80"
      - "0.0.0.0:${HTTPS_PORT:-8444}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
